<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mayara Olivier Nails</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf8fc;
  color: #201a23;
}

header {
  background: #17131a;
  color: white;
  text-align: center;
  padding: 45px 20px;
  border-bottom: 4px solid #a875c9;
}

.logo {
  font-family: Georgia, serif;
  font-size: 32px;
  margin-bottom: 10px;
}

.subtitle {
  color: #d9bce8;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 22px;
}

.card {
  background: white;
  padding: 24px;
  margin-bottom: 20px;
  border-radius: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

h2 {
  font-family: Georgia, serif;
  color: #40284b;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d7c9dc;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}

.horarios {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.horario {
  padding: 14px;
  border: 1px solid #a875c9;
  border-radius: 12px;
  background: white;
  color: #40284b;
  font-weight: bold;
  font-size: 16px;
}

.horario.selecionado {
  background: #40284b;
  color: white;
}

.agendar {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #40284b;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.info {
  text-align: center;
  line-height: 1.7;
}

.instagram {
  color: #80509d;
  font-weight: bold;
}

footer {
  background: #17131a;
  color: white;
  text-align: center;
  padding: 25px;
  font-size: 13px;
}

@media (max-width: 500px) {
  .logo {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Mayara Olivier Nails</div>
  <div class="subtitle">
    Beleza, delicadeza e sofisticação ✨
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>Agende seu horário 💅🏻</h2>

    <label>Procedimento</label>

    <select id="procedimento">
      <option value="">Escolha o procedimento</option>
      <option>Alongamento de unhas</option>
      <option>Manutenção</option>
      <option>Banho de gel</option>
      <option>Unha em gel</option>
      <option>Unha decorada</option>
    </select>

    <label>Data</label>

    <input type="date" id="data">

    <label>Horário</label>

    <div class="horarios">

      <button type="button" class="horario" onclick="selecionarHorario('09:00', this)">
        09:00
      </button>

      <button type="button" class="horario" onclick="selecionarHorario('11:00', this)">
