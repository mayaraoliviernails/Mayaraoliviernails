<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mayara Olivier Nails</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f7f9;
  color: #2d2332;
}

header {
  background: #17131a;
  color: white;
  text-align: center;
  padding: 45px 20px;
  border-bottom: 5px solid #a77bce;
}

.logo {
  font-family: Georgia, serif;
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  color: #d8bce9;
  font-size: 16px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 22px;
}

.card {
  background: white;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 22px;
  box-shadow: 0 8px 25px #00000012;
}

h2 {
  font-family: Georgia, serif;
  margin-top: 0;
  color: #33243b;
  font-size: 30px;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
  font-size: 18px;
}

select,
input {
  width: 100%;
  padding: 17px;
  border: 1px solid #d8d1dc;
  border-radius: 18px;
  font-size: 17px;
  background: white;
}

.horarios {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
